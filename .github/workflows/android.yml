name: Android APK

# Builds a real, installable APK on GitHub — no local Android SDK required.
# Every push publishes/updates the `apk-latest` release with the ready-to-install
# file, plus a normal workflow artifact for auditing.
#
# © 2026 Mohamed Ibrahim Abu El-Ezz — All Rights Reserved.
# محمد إبراهيم أبو العز

on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish/refresh the apk-latest release'
        type: boolean
        default: true
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      URLM_KEYSTORE_BASE64: ${{ secrets.URLM_KEYSTORE_BASE64 }}
      URLM_KEYSTORE_PASSWORD: ${{ secrets.URLM_KEYSTORE_PASSWORD }}
      URLM_KEY_ALIAS: ${{ secrets.URLM_KEY_ALIAS }}
      URLM_KEY_PASSWORD: ${{ secrets.URLM_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Report and complete the Android SDK
        # GitHub-hosted images already ship the Android SDK, so we only top up the
        # exact packages this project compiles against (no third-party action to
        # break the build).
        run: |
          set -x
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME" || true
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          echo "SDKMANAGER=$SDKMANAGER"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          fi
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Install dependencies
        run: npm ci

      - name: Type-check every package
        run: npm run typecheck

      - name: Run the test suites (core · bridge · web)
        run: npm run test:all

      - name: Build the web app (the exact bundle the APK ships)
        run: npm run build -w @urlm/web

      - name: Generate Android icons and splash screens
        run: npm run assets -w @urlm/mobile

      - name: Sync Capacitor into the Android project
        working-directory: packages/mobile
        run: npx cap sync android

      - name: Decode the release keystore (only when the secrets are configured)
        if: env.URLM_KEYSTORE_BASE64 != ''
        run: |
          echo "$URLM_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/urlm-release.jks"
          echo "URLM_KEYSTORE_FILE=$RUNNER_TEMP/urlm-release.jks" >> "$GITHUB_ENV"

      - name: Assemble debug + release APKs
        working-directory: packages/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp packages/mobile/android/app/build/outputs/apk/release/app-release.apk \
             "artifacts/universal-router-manager-$(node -p "require('./package.json').version").apk"
          cp packages/mobile/android/app/build/outputs/apk/debug/app-debug.apk \
             "artifacts/universal-router-manager-$(node -p "require('./package.json').version")-debug.apk"
          ls -la artifacts
          echo "### APK ready" >> "$GITHUB_STEP_SUMMARY"
          echo "- signed with: $([ -n "$URLM_KEYSTORE_FILE" ] && echo 'repository release keystore' || echo 'debug keystore (add the URLM_KEYSTORE_BASE64 secret to change this)')" >> "$GITHUB_STEP_SUMMARY"
          du -h artifacts/*.apk >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the APK contents (manifest + packaged engine)
        run: |
          APK="artifacts/universal-router-manager-$(node -p "require('./package.json').version").apk"
          ls -la "$APK"
          APK="$APK" python3 - <<'PY' > verify.txt
          import hashlib, os, zipfile

          apk = os.environ["APK"]
          data = open(apk, "rb").read()
          archive = zipfile.ZipFile(apk)
          names = archive.namelist()
          print("### التحقق الآلي من الحزمة (CI)")
          print()
          print("```")
          print("apk      :", os.path.basename(apk))
          print("size     :", "%.2f MB" % (len(data) / 1048576))
          print("sha256   :", hashlib.sha256(data).hexdigest())
          web = [n for n in names if n.startswith("assets/public/")]
          print("web files:", len(web))
          for name in sorted(web):
              if name.endswith((".html", ".webmanifest", ".css")) or "/assets/" in name:
                  print("   ", name, "(%d B)" % archive.getinfo(name).file_size)
          print("native libs:", sorted({n.split("/")[1] for n in names if n.startswith("lib/") and "/" in n[4:]}))
          print("on-device engine inside APK :", any("device-runtime" in n for n in names))
          print("web shell inside APK        :", any(n.endswith("assets/public/index.html") for n in names))
          print("capacitor config inside APK :", any(n.endswith("assets/capacitor.config.json") for n in names))
          print("```")
          assert any("device-runtime" in n for n in names), "missing on-device engine chunk"
          assert any(n.endswith("assets/public/index.html") for n in names), "missing web shell"
          assert any(n.endswith("assets/capacitor.config.json") for n in names), "missing capacitor config"
          PY
          cat verify.txt
          grep -q "on-device engine inside APK : True" verify.txt || { echo "::error::the on-device engine chunk is missing from the APK"; exit 1; }
          grep -q "web shell inside APK        : True" verify.txt || { echo "::error::the web shell is missing from the APK"; exit 1; }
          echo "APK verified: engine + shell are packaged ✔"

      - name: Report the manifest via aapt2 (best effort)
        continue-on-error: true
        run: |
          APK="artifacts/universal-router-manager-$(node -p "require('./package.json').version").apk"
          AAPT="$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/aapt2 2>/dev/null | tail -1)"
          {
            echo
            echo "manifest (aapt2, ${AAPT:-unavailable}):"
            echo '```'
            if [ -n "$AAPT" ]; then
              "$AAPT" dump badging "$APK" 2>&1 | grep -aE "^(package|application-label|sdkVersion|targetSdkVersion|uses-permission|native-code)" | head -14 || true
            else
              echo "aapt2 not found"
            fi
            echo '```'
          } >> verify.txt
          tail -20 verify.txt

      - name: Compose the release notes
        run: |
          {
            cat <<'MD'
          ## مدير الراوتر الشامل — Universal Router Manager
          **التطبيق الكامل للأندرويد (APK)** — المحرّك كله يعمل داخل الهاتف: بدون كمبيوتر، بدون جسر، وبدون سيرفر.

          ### التثبيت
          1. نزّل ملف `universal-router-manager-1.0.0.apk` من الأسفل (ملف الـ debug للمطوّرين فقط).
          2. على الهاتف: افتح الملف → اسمح بالتثبيت من مصادر غير معروفة (مرة واحدة) → ثبّت.
          3. التطبيق يبدأ في **الوضع التجريبي** (راوتر Huawei محاكى: `admin` / `Admin@123`) لتجربة كل شاشة بأمان.
          4. لراوترك: من الشريط العلوي → **وضع التشغيل** → «استخدم الراوتر الحقيقي»، وكن متصلاً بواي فاي الراوتر.

          ### ما يعمل داخل التطبيق
          * اكتشاف الراوتر والتعرّف عليه (Fingerprint + نسبة ثقة) ثم اختيار المحوّل المناسب، ومع الثقة المنخفضة يظهر «تم التعرف على الراوتر بثقة محدودة» ويُستخدم محوّل عام آمن.
          * تسجيل الدخول بكل طرقه، الأجهزة (إيقاف/استئناف، تحديد السرعة، الاسم)، الواي فاي والمحلل، النطاق الترددي، الأمان، المساعد الذكي بالعربية، Smart Fix، واختبار السرعة.
          * **كل تغيير يتم التحقق منه** بقراءة القيمة بعده: «✓ تم تطبيق الحل بنجاح» أو «⚠️ لم يتم تطبيق التغيير. السبب: …» — بلا أي نجاح وهمي.
          * كلمات المرور المحفوظة تُشفَّر بمفتاح داخل **Android Keystore**؛ وبدون تحديد «تذكّر هذا الراوتر» لا يُخزَّن شيء.
          * قياس الإنترنت الحقيقي (رفع/تنزيل) يحتاج موافقتك من شاشة اختبار السرعة؛ الافتراضي قياس محلي بين الهاتف والراوتر.

          ### ملاحظات
          * يُستخدم فقط على شبكة تملكها أو مصرّح لك بإدارتها.
          * توقيع الحزمة: `فوق` — راجع docs/ANDROID.md.
          * يُعاد بناء هذه الحزمة تلقائيًا مع كل تحديث للكود على GitHub.

          **المطوّر:** محمد إبراهيم أبو العز — *Mohamed Ibrahim Abu El-Ezz*
          **الهوية:** ABU ELAZ ULTRA MAN
          **© 2026 Mohamed Ibrahim Abu El-Ezz — All Rights Reserved.**
          MD
            echo
            cat verify.txt
          } > release-body.md
          if [ -n "${URLM_KEYSTORE_FILE:-}" ]; then
            SIGNING_LINE='* توقيع الحزمة: مفتاح إصدار خاص (repository secrets) — لا يمكن تحديث التطبيق إلا بنفس المفتاح.'
          else
            SIGNING_LINE='* توقيع الحزمة: مفتاح debug القياسي. يعمل فورًا للاستخدام الشخصي؛ ولإصدار خاص أضف الأسرار URLM_KEYSTORE_* (انظر docs/ANDROID.md).'
          fi
          SIGNING_LINE="$SIGNING_LINE" python3 - <<'PYEOF'
          import os, pathlib

          path = pathlib.Path('release-body.md')
          text = path.read_text()
          path.write_text(text.replace('* توقيع الحزمة: `فوق` — راجع docs/ANDROID.md.', os.environ['SIGNING_LINE']))
          PYEOF
          grep -n 'توقيع الحزمة' release-body.md

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal-router-manager-apk
          path: |
            artifacts/*.apk
            verify.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish the APK as a GitHub release
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 'Universal Router Manager — APK (v1.0.0)'
          prerelease: true
          make_latest: false
          files: artifacts/*.apk
          body_path: release-body.md
